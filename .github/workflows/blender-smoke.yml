name: blender-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  compile-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 python3-numpy
          blender --version
          blender --background --python-expr "import sys; print('BLENDER_PYTHON', sys.version); import numpy; print('NUMPY', numpy.__version__)"

      - name: Compile cliff kitchen regression target
        run: |
          blender --background --python blender/build_asset.py -- \
            --spec examples/cliff_kitchen.scene_spec.json \
            --out build/cliff_kitchen.glb \
            --preview build/cliff_kitchen.png \
            --preview-dir build/cliff_kitchen_views \
            --report build/cliff_kitchen.validation.json

      - name: Resolve uploaded mother-image analysis
        run: |
          python3 tools/resolve_reference.py \
            --analysis examples/cliff_ground_floor.reference_analysis.json \
            --out build/reference/cliff_ground_floor.scene_spec.json \
            --report build/reference/cliff_ground_floor.resolution.json \
            --seed 23 \
            --minimum-confidence 0.35

      - name: Compile initial reference-derived ground floor
        run: |
          blender --background --python blender/build_asset.py -- \
            --spec build/reference/cliff_ground_floor.scene_spec.json \
            --out build/cliff_ground_floor_initial.glb \
            --preview build/cliff_ground_floor_initial.png \
            --preview-dir build/cliff_ground_floor_initial_views \
            --report build/cliff_ground_floor_initial.validation.json

      - name: Apply bounded visual QA repair
        run: |
          python3 tools/apply_visual_review.py \
            --spec build/reference/cliff_ground_floor.scene_spec.json \
            --review examples/cliff_ground_floor.visual_review.json \
            --out build/repair/cliff_ground_floor.scene_spec.json \
            --report build/repair/cliff_ground_floor.repair.json \
            --minimum-confidence 0.40

      - name: Compile repaired ground floor with semantic macros
        run: |
          blender --background --python blender/build_asset.py -- \
            --spec build/repair/cliff_ground_floor.scene_spec.json \
            --out build/cliff_ground_floor_repaired.glb \
            --preview build/cliff_ground_floor_repaired.png \
            --preview-dir build/cliff_ground_floor_repaired_views \
            --report build/cliff_ground_floor_repaired.validation.json

      - name: Verify outputs and semantic macro expansion
        run: |
          test -s build/cliff_kitchen.glb
          test -s build/reference/cliff_ground_floor.scene_spec.json
          test -s build/cliff_ground_floor_initial.glb
          test -s build/repair/cliff_ground_floor.repair.json
          test -s build/cliff_ground_floor_repaired.glb
          test -s build/cliff_ground_floor_repaired.png
          test -s build/cliff_ground_floor_repaired_views/view_045.png
          test -s build/cliff_ground_floor_repaired_views/view_135.png
          test -s build/cliff_ground_floor_repaired_views/view_225.png
          test -s build/cliff_ground_floor_repaired_views/view_315.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          kitchen = json.loads(Path('build/cliff_kitchen.validation.json').read_text())
          initial = json.loads(Path('build/cliff_ground_floor_initial.validation.json').read_text())
          repaired = json.loads(Path('build/cliff_ground_floor_repaired.validation.json').read_text())
          repair = json.loads(Path('build/repair/cliff_ground_floor.repair.json').read_text())

          assert kitchen['status'] == 'pass', kitchen
          assert initial['status'] == 'pass', initial
          assert repaired['status'] == 'pass', repaired
          assert repaired['metrics']['triangles'] >= initial['metrics']['triangles'], (initial, repaired)
          assert repaired['metrics']['mesh_objects'] >= initial['metrics']['mesh_objects'], (initial, repaired)
          # PR #6 closed-loop baseline was 135 meshes / 3160 triangles. These semantic
          # macros must materially exceed that rather than merely rename old props.
          assert repaired['metrics']['mesh_objects'] > 220, repaired
          assert repaired['metrics']['triangles'] > 4500, repaired
          assert repaired['metrics']['non_manifold_edges'] == 0, repaired
          assert repaired['metrics']['zero_area_faces'] == 0, repaired
          assert all(item['accepted'] for item in repair['decisions'])
          assert all(item['accepted'] for item in repair['room_decisions'])

          print('initial validation', json.dumps(initial, indent=2))
          print('semantic-macro repaired validation', json.dumps(repaired, indent=2))
          PY

      - name: Upload semantic-macro assets and QA views
        uses: actions/upload-artifact@v4
        with:
          name: storage-kitchen-macro-smoke
          path: build/
          if-no-files-found: error
