name: blender-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  compile-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libglx-mesa0 python3-numpy
          blender --version
          blender --background --python-expr "import sys; print('BLENDER_PYTHON', sys.version); import numpy; print('NUMPY', numpy.__version__)"

      - name: Compile cliff kitchen regression target
        run: |
          blender --background --python blender/build_asset.py -- \
            --spec examples/cliff_kitchen.scene_spec.json \
            --out build/cliff_kitchen.glb \
            --preview build/cliff_kitchen.png \
            --preview-dir build/cliff_kitchen_views \
            --report build/cliff_kitchen.validation.json

      - name: Resolve uploaded mother-image analysis
        run: |
          python3 tools/resolve_reference.py \
            --analysis examples/cliff_ground_floor.reference_analysis.json \
            --out build/reference/cliff_ground_floor.scene_spec.json \
            --report build/reference/cliff_ground_floor.resolution.json \
            --seed 23 \
            --minimum-confidence 0.35

      - name: Compile reference-derived multi-room ground floor
        run: |
          blender --background --python blender/build_asset.py -- \
            --spec build/reference/cliff_ground_floor.scene_spec.json \
            --out build/cliff_ground_floor_from_reference.glb \
            --preview build/cliff_ground_floor_from_reference.png \
            --preview-dir build/cliff_ground_floor_from_reference_views \
            --report build/cliff_ground_floor_from_reference.validation.json

      - name: Verify outputs
        run: |
          test -s build/cliff_kitchen.glb
          test -s build/cliff_kitchen.png
          test -s build/reference/cliff_ground_floor.scene_spec.json
          test -s build/reference/cliff_ground_floor.resolution.json
          test -s build/cliff_ground_floor_from_reference.glb
          test -s build/cliff_ground_floor_from_reference.png
          test -s build/cliff_ground_floor_from_reference_views/view_045.png
          test -s build/cliff_ground_floor_from_reference_views/view_135.png
          test -s build/cliff_ground_floor_from_reference_views/view_225.png
          test -s build/cliff_ground_floor_from_reference_views/view_315.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          kitchen = json.loads(Path('build/cliff_kitchen.validation.json').read_text())
          derived = json.loads(Path('build/cliff_ground_floor_from_reference.validation.json').read_text())
          resolution = json.loads(Path('build/reference/cliff_ground_floor.resolution.json').read_text())
          assert kitchen['status'] == 'pass', kitchen
          assert derived['status'] == 'pass', derived
          assert derived['metrics']['mesh_objects'] > 0, derived
          assert derived['metrics']['triangles'] > 0, derived
          assert any(item['accepted'] for item in resolution['decisions'])
          assert any(not item['accepted'] for item in resolution['decisions'])
          print('reference-derived validation', json.dumps(derived, indent=2))
          print('resolution decisions', json.dumps(resolution, indent=2))
          PY

      - name: Upload compiled assets, resolver outputs, and QA views
        uses: actions/upload-artifact@v4
        with:
          name: reference-to-spec-smoke
          path: build/
          if-no-files-found: error
